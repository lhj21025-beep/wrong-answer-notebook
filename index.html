<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>오답노트</title>
<meta name="theme-color" content="#6C5CE7" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F5FB;
    --surface:#FFFFFF;
    --primary:#6C5CE7;
    --primary-dark:#5849C2;
    --primary-soft:#EEEBFD;
    --success:#00B894;
    --success-soft:#E4F9F3;
    --danger:#FF6B6B;
    --danger-soft:#FFECEC;
    --text:#2D3436;
    --text-sub:#8B90A0;
    --border:#EEEEF4;
    --radius:18px;
    --shadow:0 4px 20px rgba(108,92,231,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); overscroll-behavior-y:none;}
  #app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}

  header.topbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:18px 20px 8px; display:flex; align-items:center; justify-content:space-between;}
  header.topbar h1{font-size:20px; font-weight:800; margin:0; letter-spacing:-0.3px;}
  header.topbar .sub{font-size:12px; color:var(--text-sub); margin-top:2px;}

  main{flex:1; padding:8px 16px 100px; overflow-y:auto;}
  .view{display:none; animation:fadeIn .25s ease;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- 공통 카드 ---------- */
  .card{background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .stat-box{background:var(--surface); border-radius:16px; padding:16px; box-shadow:var(--shadow);}
  .stat-box .num{font-size:26px; font-weight:800; color:var(--primary);}
  .stat-box .label{font-size:12px; color:var(--text-sub); margin-top:4px;}

  .section-title{font-size:15px; font-weight:700; margin:18px 4px 10px; color:var(--text);}

  /* ---------- 홈 ---------- */
  .quick-add-btn{width:100%; padding:16px; border:none; border-radius:var(--radius); background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 6px 18px rgba(108,92,231,0.35);}
  .recent-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
  .recent-item:last-child{border-bottom:none;}
  .tag{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .recent-item .txt{flex:1; min-width:0;}
  .recent-item .txt .q{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .recent-item .txt .d{font-size:11.5px; color:var(--text-sub); margin-top:2px;}

  /* ---------- 추가 ---------- */
  .upload-zone{border:2px dashed #D7D3F5; border-radius:var(--radius); background:var(--primary-soft); text-align:center; padding:28px 16px; cursor:pointer; position:relative; overflow:hidden;}
  .upload-zone img{max-width:100%; max-height:260px; border-radius:12px; display:block; margin:0 auto;}
  .upload-zone .hint{font-size:13px; color:var(--primary-dark); font-weight:600; margin-top:8px;}
  .upload-zone .hint-sub{font-size:11.5px; color:var(--text-sub); margin-top:2px;}
  input[type=file]{display:none;}

  .btn{border:none; border-radius:14px; padding:14px; font-size:14.5px; font-weight:700; cursor:pointer; width:100%;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:disabled{background:#C9C4F0; cursor:not-allowed;}
  .btn-ghost{background:var(--surface); color:var(--primary); border:1.5px solid var(--primary-soft);}
  .btn-danger-ghost{background:var(--danger-soft); color:var(--danger);}
  .btn-row{display:flex; gap:8px; margin-top:10px;}

  label.field-label{font-size:12.5px; font-weight:700; color:var(--text-sub); margin:14px 0 6px; display:block;}
  input[type=text], input[type=date], select, textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border); background:#FAFAFD; font-size:14px; font-family:inherit; color:var(--text);
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--primary);}

  .reason-add-row{display:flex; gap:8px; margin-top:8px;}
  .reason-add-row input{flex:1;}
  .reason-add-row button{width:auto; padding:0 16px;}

  .problem-card{background:var(--surface); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); border:1.5px solid var(--border);}
  .problem-card-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .problem-card-header .num-tag{font-size:12px; font-weight:800; color:var(--primary); background:var(--primary-soft); padding:4px 12px; border-radius:20px;}

  .spinner{width:16px; height:16px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:-3px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- 목록 ---------- */
  .filter-bar{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .filter-bar select{width:auto; flex-shrink:0; padding:9px 12px; font-size:12.5px; font-weight:600; background:var(--surface);}
  .entry-card{background:var(--surface); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow);}
  .entry-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .entry-q{font-size:14.5px; font-weight:700; line-height:1.4; margin:8px 0 6px;}
  .entry-meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .entry-ans{font-size:12.5px; color:var(--text-sub); line-height:1.7;}
  .entry-ans b{color:var(--text); font-weight:700;}
  .entry-actions{display:flex; gap:6px; margin-top:12px;}
  .icon-btn{border:none; background:var(--bg); border-radius:10px; padding:8px 10px; font-size:12px; font-weight:700; color:var(--text-sub); cursor:pointer; display:flex; align-items:center; gap:4px;}
  .retry-toggle{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
  .retry-toggle label{font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer;}
  .retry-result{display:flex; gap:6px; margin-left:auto;}
  .retry-result button{border:none; border-radius:10px; padding:6px 10px; font-size:11.5px; font-weight:700; cursor:pointer; opacity:.4;}
  .retry-result button.active{opacity:1;}
  .retry-result .ok{background:var(--success-soft); color:var(--success);}
  .retry-result .no{background:var(--danger-soft); color:var(--danger);}
  .empty{text-align:center; padding:60px 20px; color:var(--text-sub);}
  .empty .emoji{font-size:38px; margin-bottom:10px;}

  /* ---------- 통계 ---------- */
  .chart-card{background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px;}
  .chart-card h3{font-size:13.5px; margin:0 0 12px; color:var(--text-sub); font-weight:700;}

  /* ---------- 하단 탭바 ---------- */
  nav.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; background:rgba(255,255,255,0.92); backdrop-filter:blur(14px); border-top:1px solid var(--border); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); z-index:30;}
  nav.tabbar button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--text-sub); cursor:pointer;}
  nav.tabbar button svg{width:22px; height:22px;}
  nav.tabbar button span{font-size:10.5px; font-weight:600;}
  nav.tabbar button.active{color:var(--primary);}

  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#2D3436; color:#fff; padding:11px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:88%; text-align:center; white-space:normal; line-height:1.5;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div>
      <h1 id="pageTitle">오답노트</h1>
      <div class="sub" id="pageSub">오늘도 한 걸음 더 똑똑해지는 중</div>
    </div>
  </header>

  <main>

    <!-- ================= 홈 ================= -->
    <section class="view active" id="view-home">
      <div class="stat-grid">
        <div class="stat-box"><div class="num" id="homeTotal">0</div><div class="label">누적 오답</div></div>
        <div class="stat-box"><div class="num" id="homeWeek">0</div><div class="label">이번 주 추가</div></div>
      </div>
      <button class="quick-add-btn" onclick="switchTab('add')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
        오답 사진 추가하기
      </button>
      <div class="section-title">최근 추가한 오답</div>
      <div class="card" id="recentList"><div class="empty"><div class="emoji">📝</div>아직 등록된 오답이 없어요</div></div>
    </section>

    <!-- ================= 추가 ================= -->
    <section class="view" id="view-add">
      <div class="upload-zone" id="uploadZone">
        <img id="previewImg" style="display:none;" />
        <div id="uploadHintWrap">
          <div style="font-size:32px;">📷</div>
          <div class="hint">문제 사진을 올려주세요</div>
          <div class="hint-sub">아래 버튼 중 하나를 선택하세요</div>
        </div>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-ghost" onclick="document.getElementById('cameraInput').click()">📷 사진 촬영</button>
        <button class="btn btn-ghost" onclick="document.getElementById('galleryInput').click()">🖼 갤러리에서 선택</button>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />
      <input type="file" id="galleryInput" accept="image/*" style="display:none;" />

      <button class="btn btn-primary" id="analyzeBtn" style="margin-top:12px; display:none;" onclick="runAnalyze()">AI로 자동 인식하기</button>

      <div id="formArea" style="display:none;">
        <div class="btn-row">
          <div style="flex:1;">
            <label class="field-label">학년</label>
            <select id="f_grade"></select>
          </div>
          <div style="flex:1;">
            <label class="field-label">학기</label>
            <select id="f_semester">
              <option value="1학기">1학기</option>
              <option value="2학기">2학기</option>
            </select>
          </div>
        </div>
        <label class="field-label">날짜 (전체 공통)</label>
        <input type="date" id="f_date" />

        <div id="problemCardsWrap"></div>

        <button class="btn btn-ghost" style="margin-top:10px;" onclick="addBlankProblemCard()">+ 문제 직접 추가</button>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="saveAllEntries()" id="saveBtn">오답노트에 전체 저장 (<span id="saveCount">0</span>개)</button>
      </div>
    </section>

    <!-- ================= 목록 ================= -->
    <section class="view" id="view-list">
      <div class="filter-bar">
        <select id="filterGrade"><option value="">전체 학년</option></select>
        <select id="filterSubject"><option value="">전체 과목</option></select>
        <select id="filterReason"><option value="">전체 이유</option></select>
        <select id="filterDifficulty"><option value="">전체 난이도</option></select>
        <select id="filterRange">
          <option value="all">전체 기간</option>
          <option value="7">최근 7일</option>
          <option value="30">최근 30일</option>
        </select>
      </div>
      <div id="listArea"></div>
    </section>

    <!-- ================= 통계 ================= -->
    <section class="view" id="view-stats">
      <div class="stat-grid">
        <div class="stat-box"><div class="num" id="statTotal">0</div><div class="label">전체 오답 수</div></div>
        <div class="stat-box"><div class="num" id="statRetryRate">-</div><div class="label">재도전 정답률</div></div>
      </div>
      <div class="chart-card"><h3>과목별 오답 수</h3><canvas id="chartSubject" height="180"></canvas></div>
      <div class="chart-card"><h3>틀린 이유별 분포</h3><canvas id="chartReason" height="180"></canvas></div>
      <div class="chart-card"><h3>주별 오답 추이</h3><canvas id="chartTrend" height="180"></canvas></div>
    </section>

    <!-- ================= 설정 ================= -->
    <section class="view" id="view-settings">
      <div class="card">
        <label class="field-label">기본 학년 (새 문제 등록 시 기본으로 적용)</label>
        <select id="s_defaultGrade"></select>
        <label class="field-label">기본 학기</label>
        <select id="s_defaultSemester">
          <option value="1학기">1학기</option>
          <option value="2학기">2학기</option>
        </select>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="saveSettings()">설정 저장</button>
      </div>
      <div class="card">
        <div class="section-title" style="margin:0 0 8px;">안내</div>
        <div class="entry-ans">
          매년 3월 1일이 지나면 앱을 열 때 "기본 학년을 올릴까요?"라고 한 번 물어봐요.<br/>
          여기서 설정한 기본 학년/학기는 오답 추가 화면에서 문제마다 자유롭게 바꿔서 등록할 수 있어요 (선행학습/복습용).
        </div>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>홈</span>
    </button>
    <button class="tab-btn" data-tab="add" onclick="switchTab('add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
      <span>추가</span>
    </button>
    <button class="tab-btn" data-tab="list" onclick="switchTab('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
      <span>목록</span>
    </button>
    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7" stroke-linecap="round"/></svg>
      <span>통계</span>
    </button>
    <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script type="module">
/* =========================================================
   ⚙️ 설정: 아래 두 값만 채워주세요
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCw2GCBQDpgsCQ6Lx-YjKn6BPRR8fwpZDQ",
  authDomain: "wrong-answer-note.firebaseapp.com",
  projectId: "wrong-answer-note",
  storageBucket: "wrong-answer-note.firebasestorage.app",
  messagingSenderId: "426411231100",
  appId: "1:426411231100:web:805352c49ffd3c9f8306f9"
};
const GEMINI_API_KEY = "AQ.Ab8RN6Km1WjLUaMFv0yiBYrgo8buFbbgCpryUb2D_HJlbFymAg";
const GEMINI_MODEL = "gemini-3.6-flash";
/* ========================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DEFAULT_REASONS = ["계산실수", "개념이해 부족", "문제를 끝까지 읽지 않음", "단위 실수", "공식 암기 부족", "시간 부족", "부주의", "찍음", "응용력 부족", "집중력 부족", "기타"];
const GRADES = ["초1","초2","초3","초4","초5","초6"];
const SEMESTERS = ["1학기","2학기"];
const DIFFICULTIES = ["하","중","상"];
const SUBJECT_COLORS = {
  "국어": ["#FFE3EC","#E85D8C"], "수학": ["#E3EEFF","#4C7CF0"], "영어": ["#EEE3FF","#8B5CF6"],
  "사회": ["#FFF1E0","#F0924C"], "과학": ["#E1FBF0","#1FAE7A"], "기타": ["#F0F0F5","#8B90A0"]
};

let entries = [];
let reasons = [];
let currentImage = { base64: null, mimeType: null };
let problemCards = [];
let settings = { defaultGrade: '초4', defaultSemester: '1학기', lastGradeBumpYear: null };
const MAX_PROBLEMS = 5;

/* ---------------- 초기 로딩 ---------------- */
async function init(){
  fillGradeSelects();
  await loadSettings();
  await loadReasons();
  await loadEntries();
  document.getElementById('f_date').valueAsDate = new Date();
  document.getElementById('f_grade').value = settings.defaultGrade;
  document.getElementById('f_semester').value = settings.defaultSemester;
  checkMarchGradeBump();
  renderHome();
  renderList();
  renderStats();
}

function fillGradeSelects(){
  const opts = GRADES.map(g => `<option value="${g}">${g}</option>`).join('');
  document.getElementById('f_grade').innerHTML = opts;
  document.getElementById('s_defaultGrade').innerHTML = opts;
  document.getElementById('filterGrade').innerHTML = `<option value="">전체 학년</option>` + opts;
  document.getElementById('filterDifficulty').innerHTML = `<option value="">전체 난이도</option>` + DIFFICULTIES.map(d => `<option value="${d}">${d}</option>`).join('');
}

async function loadSettings(){
  try {
    const snap = await getDoc(doc(db, "settings", "app"));
    if (snap.exists()){
      settings = { ...settings, ...snap.data() };
    } else {
      await setDoc(doc(db, "settings", "app"), settings);
    }
  } catch(e){ console.error(e); }
  document.getElementById('s_defaultGrade').value = settings.defaultGrade;
  document.getElementById('s_defaultSemester').value = settings.defaultSemester;
}

window.saveSettings = async function(){
  settings.defaultGrade = document.getElementById('s_defaultGrade').value;
  settings.defaultSemester = document.getElementById('s_defaultSemester').value;
  try {
    await setDoc(doc(db, "settings", "app"), settings, { merge: true });
    showToast('설정을 저장했어요 ✓');
  } catch(e){ console.error(e); showToast('설정 저장 실패: ' + e.message, 5000); }
};

function checkMarchGradeBump(){
  const now = new Date();
  const year = now.getFullYear();
  const marchFirst = new Date(year, 2, 1); // 2 = 3월(0-indexed)
  if (now < marchFirst) return;
  if (settings.lastGradeBumpYear === year) return;

  const idx = GRADES.indexOf(settings.defaultGrade);
  const nextGrade = (idx >= 0 && idx < GRADES.length - 1) ? GRADES[idx + 1] : settings.defaultGrade;
  const ok = window.confirm(`3월이 지났어요! 기본 학년을 ${settings.defaultGrade} → ${nextGrade}(으)로 올릴까요?`);
  settings.lastGradeBumpYear = year;
  if (ok && nextGrade !== settings.defaultGrade){
    settings.defaultGrade = nextGrade;
    document.getElementById('f_grade').value = nextGrade;
  }
  document.getElementById('s_defaultGrade').value = settings.defaultGrade;
  setDoc(doc(db, "settings", "app"), settings, { merge: true }).catch(e => console.error(e));
}

async function loadReasons(){
  try {
    const snap = await getDocs(collection(db, "reasons"));
    reasons = snap.docs.map(d => d.data().name);
    if (reasons.length === 0){
      for (const r of DEFAULT_REASONS) await addDoc(collection(db, "reasons"), { name: r });
      reasons = [...DEFAULT_REASONS];
    } else {
      // 기존 사용자: 새로 추가된 기본 오답사유 중 없는 것만 추가 (기존 커스텀 이유는 그대로 유지)
      const missing = DEFAULT_REASONS.filter(r => !reasons.includes(r));
      for (const r of missing) await addDoc(collection(db, "reasons"), { name: r });
      reasons = reasons.concat(missing);
    }
  } catch(e){ reasons = [...DEFAULT_REASONS]; console.error(e); }
  fillReasonSelects();
}

async function loadEntries(){
  try {
    const q = query(collection(db, "entries"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e){ console.error(e); entries = []; }
  fillFilterOptions();
}

function fillReasonSelects(){
  const filterReason = document.getElementById('filterReason');
  filterReason.innerHTML = `<option value="">전체 이유</option>` + reasons.map(r => `<option value="${r}">${r}</option>`).join('');
}

async function handleFileSelected(e){
  const file = e.target.files[0];
  if (!file) return;

  currentImage = compressed;
  document.getElementById('previewImg').src = 'data:' + compressed.mimeType + ';base64,' + compressed.base64;
  document.getElementById('previewImg').style.display = 'block';

  document.getElementById('formArea').style.display = 'none';
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height *= maxDim/width; width = maxDim; }
        else if (height > maxDim){ width *= maxDim/height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Gemini 분석 ---------------- */
window.runAnalyze = async function(){
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>인식하는 중...';
  try {
    const prompt = `이 이미지에는 초등학생이 푼 시험지 또는 문제집의 오답이 1개 이상 포함되어 있을 수 있습니다.
이미지에서 찾을 수 있는 "틀린" 문제만 최대 ${MAX_PROBLEMS}개까지 찾아 각각 아래 형식으로 정리해서, 순수 JSON 객체 하나로만 응답하세요. 다른 설명이나 코드블록 없이 JSON만 반환하세요. 맞은 문제는 포함하지 마세요. 오답이 1개뿐이면 배열에 1개만 넣으세요.
{"problems":[{"subject":"국어/수학/영어/사회/과학 중 추정되는 과목(모르면 빈 문자열)","unit":"이 문제가 속한 단원 추정(예: 분수, 소수, 도형, 독해, 어휘, 문법 등. 모르면 빈 문자열)","difficulty":"하/중/상 중 추정 난이도","questionText":"문제 내용을 간략히 정리","studentAnswer":"학생이 작성한 답(보이면 적고 안 보이면 빈 문자열)","correctAnswer":"정답(보이거나 유추 가능하면 적고 아니면 빈 문자열)"}]}`;
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: currentImage.mimeType, data: currentImage.base64 } }] }] })
    });
    const json = await res.json();
    if (json.error) throw new Error('API 오류: ' + json.error.message);
    if (!json.candidates || !json.candidates[0]) {
      const reason = (json.promptFeedback && json.promptFeedback.blockReason) || '알 수 없음';
      throw new Error('응답 없음 (사유: ' + reason + ')');
    }
    const cand = json.candidates[0];
    if (cand.finishReason && cand.finishReason !== 'STOP') {
      throw new Error('인식 중단됨 (사유: ' + cand.finishReason + ')');
    }
    let text = cand.content.parts[0].text || '';
    text = text.replace(/```json/g,'').replace(/```/g,'').trim();
    const parsed = JSON.parse(text);
    const list = Array.isArray(parsed.problems) ? parsed.problems.slice(0, MAX_PROBLEMS) : [];
    if (list.length === 0) throw new Error('오답을 찾지 못했어요. 아래 "문제 직접 추가"로 입력해주세요.');

    problemCards = list.map(p => ({
      subject: ['국어','수학','영어','사회','과학'].includes(p.subject) ? p.subject : '기타',
      unit: p.unit || '',
      difficulty: DIFFICULTIES.includes(p.difficulty) ? p.difficulty : '중',
      questionText: p.questionText || '',
      studentAnswer: p.studentAnswer || '',
      correctAnswer: p.correctAnswer || '',
      reason: reasons[0] || ''
    }));
    renderProblemCards();
    document.getElementById('formArea').style.display = 'block';
    showToast(`문제 ${problemCards.length}개 인식 완료! 내용을 확인하고 수정해주세요`);
  } catch(e){
    console.error(e);
    if (problemCards.length === 0) addBlankProblemCard();
    document.getElementById('formArea').style.display = 'block';
    showToast('인식 실패: ' + e.message, 6000);
  } finally {
    btn.disabled = false;
    btn.textContent = 'AI로 자동 인식하기';
  }
};

        </div>
        <div style="flex:1;">
          <label class="field-label">난이도</label>
          <select onchange="updateCardField(${i},'difficulty',this.value)">${difficultyOptions}</select>
        </div>
      </div>

      <label class="field-label">문제 내용</label>
      <textarea oninput="updateCardField(${i},'questionText',this.value)" placeholder="문제 내용을 입력하세요">${escapeHtml(p.questionText)}</textarea>

      <label class="field-label">아이가 쓴 답</label>
      <input type="text" value="${escapeAttr(p.studentAnswer)}" oninput="updateCardField(${i},'studentAnswer',this.value)" placeholder="학생이 작성한 답" />

      <label class="field-label">정답</label>
      <input type="text" value="${escapeAttr(p.correctAnswer)}" oninput="updateCardField(${i},'correctAnswer',this.value)" placeholder="정답" />

window.updateCardField = function(idx, field, value){
  if (problemCards[idx]) problemCards[idx][field] = value;
};

window.onReasonChange = function(idx, value){
  if (value === '__new__'){
    document.getElementById('reasonAddRow-' + idx).style.display = 'flex';
  } else {
    problemCards[idx].reason = value;
  }
};

window.confirmNewReasonForCard = async function(idx){
  const input = document.getElementById('newReasonInput-' + idx);
  const val = input.value.trim();
  if (!val) return;
  if (!reasons.includes(val)){
    await addDoc(collection(db, "reasons"), { name: val });
    reasons.push(val);
    fillReasonSelects();
  }
  problemCards[idx].reason = val;
  renderProblemCards();
};

function fillFilterOptions(){

  const current = subjSel.value;

  subjSel.innerHTML = `<option value="">전체 과목</option>` + subjects.map(s => `<option value="${s}" ${s===current?'selected':''}>${s}</option>`).join('');

['filterGrade','filterSubject','filterReason','filterDifficulty','filterRange'].forEach(id => document.getElementById(id).addEventListener('change', renderList));

function renderList(){
  const grade = document.getElementById('filterGrade').value;
  const subj = document.getElementById('filterSubject').value;
  const reason = document.getElementById('filterReason').value;
  const difficulty = document.getElementById('filterDifficulty').value;
  const range = document.getElementById('filterRange').value;
  let filtered = entries.filter(e => {
    if (grade && e.grade !== grade) return false;
    if (subj && e.subject !== subj) return false;
    if (reason && e.reason !== reason) return false;
    if (difficulty && e.difficulty !== difficulty) return false;
    if (range !== 'all'){
      const days = parseInt(range);
      const cutoff = Date.now() - days*24*60*60*1000;
      const t = e.createdAt && e.createdAt.toDate ? e.createdAt.toDate().getTime() : 0;
      if (t < cutoff) return false;
    }
    return true;
  });

  const wrap = document.getElementById('listArea');
  if (filtered.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="emoji">🔍</div>조건에 맞는 오답이 없어요</div>`;
    return;
  }
  wrap.innerHTML = filtered.map(e => {
    const c = SUBJECT_COLORS[e.subject] || SUBJECT_COLORS['기타'];
    const retriedChecked = e.retried ? 'checked' : '';
    const gradeTag = e.grade ? `<span class="tag" style="background:#F0F0F5;color:#8B90A0">${e.grade}${e.semester ? ' · '+e.semester : ''}</span>` : '';
    const unitTag = e.unit ? `<span class="tag" style="background:#F0F0F5;color:#8B90A0">📘 ${e.unit}</span>` : '';
    const diffColors = { '하':['#E4F9F3','#00B894'], '중':['#FFF6E0','#E0A200'], '상':['#FFECEC','#E02020'] };
    const diffTag = e.difficulty ? `<span class="tag" style="background:${(diffColors[e.difficulty]||['#F0F0F5','#8B90A0'])[0]};color:${(diffColors[e.difficulty]||['#F0F0F5','#8B90A0'])[1]}">난이도 ${e.difficulty}</span>` : '';
    return `
    <div class="entry-card">
      <div class="entry-top">
        <div class="entry-meta">
          <span class="tag" style="background:${c[0]};color:${c[1]}">${e.subject||'기타'}</span>
          ${gradeTag}
          ${unitTag}
          ${diffTag}
          <span class="tag" style="background:#F0F0F5;color:#8B90A0">${e.date||''}</span>
          <span class="tag" style="background:#F0F0F5;color:#8B90A0">${e.reason||''}</span>
        </div>
      </div>
      <div class="entry-q">${escapeHtml(e.questionText||'(내용 없음)')}</div>
      <div class="entry-ans"><b>학생 답:</b> ${escapeHtml(e.studentAnswer||'-')} &nbsp;·&nbsp; <b>정답:</b> ${escapeHtml(e.correctAnswer||'-')}</div>

        <button class="icon-btn" onclick="deleteEntry('${e.id}')">🗑 삭제</button>
      </div>

        <div class="retry-result">
          <button class="ok ${e.retriedCorrect===true?'active':''}" onclick="setRetryResult('${e.id}', true)">맞음</button>
          <button class="no ${e.retriedCorrect===false?'active':''}" onclick="setRetryResult('${e.id}', false)">틀림</button>

window.deleteEntry = async function(id){

};

window.toggleRetried = async function(id, checked){
  await updateDoc(doc(db, "entries", id), { retried: checked, retriedCorrect: checked ? entries.find(e=>e.id===id).retriedCorrect : null });
  const e = entries.find(x => x.id === id); e.retried = checked; if (!checked) e.retriedCorrect = null;
  renderList();
};

window.setRetryResult = async function(id, correct){
  await updateDoc(doc(db, "entries", id), { retried: true, retriedCorrect: correct });
  const e = entries.find(x => x.id === id); e.retried = true; e.retriedCorrect = correct;
  renderList(); renderStats();
};

/* ---------------- 통계 렌더 ---------------- */
let chartSubject, chartReason, chartTrend;
function renderStats(){
  document.getElementById('statTotal').textContent = entries.length;
  const retriedEntries = entries.filter(e => e.retried);
  const correctCount = retriedEntries.filter(e => e.retriedCorrect === true).length;
  document.getElementById('statRetryRate').textContent = retriedEntries.length ? Math.round(correctCount/retriedEntries.length*100)+'%' : '-';

  const bySubject = {};
  entries.forEach(e => { const s = e.subject||'기타'; bySubject[s] = (bySubject[s]||0)+1; });
  const byReason = {};
  entries.forEach(e => { const r = e.reason||'기타'; byReason[r] = (byReason[r]||0)+1; });

  const weekly = {};
  entries.forEach(e => {
    if (!e.date) return;
    const d = new Date(e.date);
    const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay()+6)%7));
    const key = `${monday.getMonth()+1}/${monday.getDate()}`;
    weekly[key] = (weekly[key]||0)+1;
  });
  const weekKeys = Object.keys(weekly).slice(-8);

  const palette = ['#6C5CE7','#4C7CF0','#E85D8C','#F0924C','#1FAE7A','#8B90A0'];

  if (chartSubject) chartSubject.destroy();
  chartSubject = new Chart(document.getElementById('chartSubject'), {
    type: 'bar',
    data: { labels: Object.keys(bySubject), datasets: [{ data: Object.values(bySubject), backgroundColor: palette, borderRadius: 8 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });

  if (chartReason) chartReason.destroy();
  chartReason = new Chart(document.getElementById('chartReason'), {
    type: 'doughnut',
    data: { labels: Object.keys(byReason), datasets: [{ data: Object.values(byReason), backgroundColor: palette }] },
    options: { plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}} }
  });

  if (chartTrend) chartTrend.destroy();
  chartTrend = new Chart(document.getElementById('chartTrend'), {
    type: 'line',
    data: { labels: weekKeys, datasets: [{ data: weekKeys.map(k=>weekly[k]), borderColor:'#6C5CE7', backgroundColor:'rgba(108,92,231,0.12)', fill:true, tension:.35 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });
}

/* ---------------- 유틸 ---------------- */
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let toastTimer;
function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), duration || 2200);
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

init();
</script>
</body>

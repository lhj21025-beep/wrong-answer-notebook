<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>오답노트</title>
<meta name="theme-color" content="#6C5CE7" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F5FB;
    --surface:#FFFFFF;
    --primary:#6C5CE7;
    --primary-dark:#5849C2;
    --primary-soft:#EEEBFD;
    --success:#00B894;
    --success-soft:#E4F9F3;
    --danger:#FF6B6B;
    --danger-soft:#FFECEC;
    --text:#2D3436;
    --text-sub:#8B90A0;
    --border:#EEEEF4;
    --radius:18px;
    --shadow:0 4px 20px rgba(108,92,231,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); overscroll-behavior-y:none;}
  #app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}

  header.topbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:18px 20px 8px; display:flex; align-items:center; justify-content:space-between;}
  header.topbar h1{font-size:20px; font-weight:800; margin:0; letter-spacing:-0.3px;}
  header.topbar .sub{font-size:12px; color:var(--text-sub); margin-top:2px;}

  main{flex:1; padding:8px 16px 100px; overflow-y:auto;}
  .view{display:none; animation:fadeIn .25s ease;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .card{background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .stat-box{background:var(--surface); border-radius:16px; padding:16px; box-shadow:var(--shadow);}
  .stat-box .num{font-size:26px; font-weight:800; color:var(--primary);}
  .stat-box .label{font-size:12px; color:var(--text-sub); margin-top:4px;}

  .section-title{font-size:15px; font-weight:700; margin:18px 4px 10px; color:var(--text);}

  .quick-add-btn{width:100%; padding:16px; border:none; border-radius:var(--radius); background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 6px 18px rgba(108,92,231,0.35);}
  .recent-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
  .recent-item:last-child{border-bottom:none;}
  .tag{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .recent-item .txt{flex:1; min-width:0;}
  .recent-item .txt .q{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .recent-item .txt .d{font-size:11.5px; color:var(--text-sub); margin-top:2px;}

  .upload-zone{border:2px dashed #D7D3F5; border-radius:var(--radius); background:var(--primary-soft); text-align:center; padding:28px 16px; cursor:pointer; position:relative; overflow:hidden;}
  .upload-zone img{max-width:100%; max-height:260px; border-radius:12px; display:block; margin:0 auto;}
  .upload-zone .hint{font-size:13px; color:var(--primary-dark); font-weight:600; margin-top:8px;}
  .upload-zone .hint-sub{font-size:11.5px; color:var(--text-sub); margin-top:2px;}
  input[type=file]{display:none;}

  .btn{border:none; border-radius:14px; padding:14px; font-size:14.5px; font-weight:700; cursor:pointer; width:100%;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:disabled{background:#C9C4F0; cursor:not-allowed;}
  .btn-ghost{background:var(--surface); color:var(--primary); border:1.5px solid var(--primary-soft);}
  .btn-danger-ghost{background:var(--danger-soft); color:var(--danger);}
  .btn-row{display:flex; gap:8px; margin-top:10px;}

  label.field-label{font-size:12.5px; font-weight:700; color:var(--text-sub); margin:14px 0 6px; display:block;}
  input[type=text], input[type=date], select, textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border); background:#FAFAFD; font-size:14px; font-family:inherit; color:var(--text);
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--primary);}

  .reason-add-row{display:flex; gap:8px; margin-top:8px;}
  .reason-add-row input{flex:1;}
  .reason-add-row button{width:auto; padding:0 16px;}

  .spinner{width:16px; height:16px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:-3px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .filter-bar{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .filter-bar select{width:auto; flex-shrink:0; padding:9px 12px; font-size:12.5px; font-weight:600; background:var(--surface);}
  .entry-card{background:var(--surface); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow);}
  .entry-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .entry-q{font-size:14.5px; font-weight:700; line-height:1.4; margin:8px 0 6px;}
  .entry-meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .entry-ans{font-size:12.5px; color:var(--text-sub); line-height:1.7;}
  .entry-ans b{color:var(--text); font-weight:700;}
  .entry-actions{display:flex; gap:6px; margin-top:12px;}
  .icon-btn{border:none; background:var(--bg); border-radius:10px; padding:8px 10px; font-size:12px; font-weight:700; color:var(--text-sub); cursor:pointer; display:flex; align-items:center; gap:4px;}
  .retry-toggle{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
  .retry-toggle label{font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer;}
  .retry-result{display:flex; gap:6px; margin-left:auto;}
  .retry-result button{border:none; border-radius:10px; padding:6px 10px; font-size:11.5px; font-weight:700; cursor:pointer; opacity:.4;}
  .retry-result button.active{opacity:1;}
  .retry-result .ok{background:var(--success-soft); color:var(--success);}
  .retry-result .no{background:var(--danger-soft); color:var(--danger);}
  .empty{text-align:center; padding:60px 20px; color:var(--text-sub);}
  .empty .emoji{font-size:38px; margin-bottom:10px;}

  .chart-card{background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px;}
  .chart-card h3{font-size:13.5px; margin:0 0 12px; color:var(--text-sub); font-weight:700;}

  nav.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; background:rgba(255,255,255,0.92); backdrop-filter:blur(14px); border-top:1px solid var(--border); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); z-index:30;}
  nav.tabbar button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--text-sub); cursor:pointer;}
  nav.tabbar button svg{width:22px; height:22px;}
  nav.tabbar button span{font-size:10.5px; font-weight:600;}
  nav.tabbar button.active{color:var(--primary);}

  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#2D3436; color:#fff; padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div>
      <h1 id="pageTitle">오답노트</h1>
      <div class="sub" id="pageSub">오늘도 한 걸음 더 똑똑해지는 중</div>
    </div>
  </header>

  <main>

    <section class="view active" id="view-home">
      <div class="stat-grid">
        <div class="stat-box"><div class="num" id="homeTotal">0</div><div class="label">누적 오답</div></div>
        <div class="stat-box"><div class="num" id="homeWeek">0</div><div class="label">이번 주 추가</div></div>
      </div>
      <button class="quick-add-btn" onclick="switchTab('add')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
        오답 사진 추가하기
      </button>
      <div class="section-title">최근 추가한 오답</div>
      <div class="card" id="recentList"><div class="empty"><div class="emoji">📝</div>아직 등록된 오답이 없어요</div></div>
    </section>

    <section class="view" id="view-add">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <img id="previewImg" style="display:none;" />
        <div id="uploadHintWrap">
          <div style="font-size:32px;">📷</div>
          <div class="hint">문제 사진을 올려주세요</div>
          <div class="hint-sub">탭해서 촬영하거나 갤러리에서 선택</div>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" />

      <button class="btn btn-primary" id="analyzeBtn" style="margin-top:12px; display:none;" onclick="runAnalyze()">AI로 자동 인식하기</button>

      <div id="formArea" style="display:none;">
        <label class="field-label">과목</label>
        <select id="f_subject">
          <option value="국어">국어</option>
          <option value="수학">수학</option>
          <option value="영어">영어</option>
          <option value="사회">사회</option>
          <option value="과학">과학</option>
          <option value="기타">기타</option>
        </select>

        <label class="field-label">날짜</label>
        <input type="date" id="f_date" />

        <label class="field-label">문제 내용</label>
        <textarea id="f_question" placeholder="문제 내용을 입력하세요"></textarea>

        <label class="field-label">아이가 쓴 답</label>
        <input type="text" id="f_studentAnswer" placeholder="학생이 작성한 답" />

        <label class="field-label">정답</label>
        <input type="text" id="f_correctAnswer" placeholder="정답" />

        <label class="field-label">틀린 이유</label>
        <select id="f_reason"></select>
        <div class="reason-add-row" id="reasonAddRow" style="display:none;">
          <input type="text" id="f_newReason" placeholder="새 이유 입력" />
          <button class="btn btn-ghost" onclick="confirmNewReason()">추가</button>
        </div>

        <button class="btn btn-primary" style="margin-top:20px;" onclick="saveEntry()" id="saveBtn">오답노트에 저장</button>
      </div>
    </section>

    <section class="view" id="view-list">
      <div class="filter-bar">
        <select id="filterSubject"><option value="">전체 과목</option></select>
        <select id="filterReason"><option value="">전체 이유</option></select>
        <select id="filterRange">
          <option value="all">전체 기간</option>
          <option value="7">최근 7일</option>
          <option value="30">최근 30일</option>
        </select>
      </div>
      <div id="listArea"></div>
    </section>

    <section class="view" id="view-stats">
      <div class="stat-grid">
        <div class="stat-box"><div class="num" id="statTotal">0</div><div class="label">전체 오답 수</div></div>
        <div class="stat-box"><div class="num" id="statRetryRate">-</div><div class="label">재도전 정답률</div></div>
      </div>
      <div class="chart-card"><h3>과목별 오답 수</h3><canvas id="chartSubject" height="180"></canvas></div>
      <div class="chart-card"><h3>틀린 이유별 분포</h3><canvas id="chartReason" height="180"></canvas></div>
      <div class="chart-card"><h3>주별 오답 추이</h3><canvas id="chartTrend" height="180"></canvas></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>홈</span>
    </button>
    <button class="tab-btn" data-tab="add" onclick="switchTab('add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
      <span>추가</span>
    </button>
    <button class="tab-btn" data-tab="list" onclick="switchTab('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
      <span>목록</span>
    </button>
    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7" stroke-linecap="round"/></svg>
      <span>통계</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyCw2GCBQDpgsCQ6Lx-YjKn6BPRR8fwpZDQ",
  authDomain: "wrong-answer-note.firebaseapp.com",
  projectId: "wrong-answer-note",
  storageBucket: "wrong-answer-note.firebasestorage.app",
  messagingSenderId: "426411231100",
  appId: "1:426411231100:web:805352c49ffd3c9f8306f9"
};
const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";
const GEMINI_MODEL = "gemini-2.0-flash";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DEFAULT_REASONS = ["계산 실수", "문제를 잘못 읽음", "개념을 몰랐음", "시간 부족", "부주의/집중력 부족", "기타"];
const SUBJECT_COLORS = {
  "국어": ["#FFE3EC","#E85D8C"], "수학": ["#E3EEFF","#4C7CF0"], "영어": ["#EEE3FF","#8B5CF6"],
  "사회": ["#FFF1E0","#F0924C"], "과학": ["#E1FBF0","#1FAE7A"], "기타": ["#F0F0F5","#8B90A0"]
};

let entries = [];
let reasons = [];
let currentImage = { base64: null, mimeType: null };

async function init(){
  await loadReasons();
  await loadEntries();
  document.getElementById('f_date').valueAsDate = new Date();
  renderHome();
  renderList();
  renderStats();
}

async function loadReasons(){
  try {
    const snap = await getDocs(collection(db, "reasons"));
    reasons = snap.docs.map(d => d.data().name);
    if (reasons.length === 0){
      for (const r of DEFAULT_REASONS) await addDoc(collection(db, "reasons"), { name: r });
      reasons = [...DEFAULT_REASONS];
    }
  } catch(e){ reasons = [...DEFAULT_REASONS]; console.error(e); }
  fillReasonSelects();
}

async function loadEntries(){
  try {
    const q = query(collection(db, "entries"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e){ console.error(e); entries = []; }
}

function fillReasonSelects(){
  const sel = document.getElementById('f_reason');
  sel.innerHTML = reasons.map(r => `<option value="${r}">${r}</option>`).join('') + `<option value="__new__">+ 새 이유 추가</option>`;
  const filterReason = document.getElementById('filterReason');
  filterReason.innerHTML = `<option value="">전체 이유</option>` + reasons.map(r => `<option value="${r}">${r}</option>`).join('');
}
document.getElementById('f_reason').addEventListener('change', e => {
  document.getElementById('reasonAddRow').style.display = e.target.value === '__new__' ? 'flex' : 'none';
});

window.confirmNewReason = async function(){
  const val = document.getElementById('f_newReason').value.trim();
  if (!val) return;
  if (!reasons.includes(val)){
    await addDoc(collection(db, "reasons"), { name: val });
    reasons.push(val);
  }
  fillReasonSelects();
  document.getElementById('f_reason').value = val;
  document.getElementById('reasonAddRow').style.display = 'none';
  document.getElementById('f_newReason').value = '';
};

window.switchTab = function(tab){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const titles = { home:["오답노트","오늘도 한 걸음 더 똑똑해지는 중"], add:["오답 추가","사진 한 장이면 충분해요"], list:["오답 목록","필터로 원하는 오답만 모아보기"], stats:["학습 통계","패턴을 알면 약점이 보여요"] };
  document.getElementById('pageTitle').textContent = titles[tab][0];
  document.getElementById('pageSub').textContent = titles[tab][1];
  if (tab === 'stats') renderStats();
  if (tab === 'list') renderList();
};

document.getElementById('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const compressed = await compressImage(file, 1024, 0.75);
  currentImage = compressed;
  document.getElementById('previewImg').src = 'data:' + compressed.mimeType + ';base64,' + compressed.base64;
  document.getElementById('previewImg').style.display = 'block';
  document.getElementById('uploadHintWrap').style.display = 'none';
  document.getElementById('analyzeBtn').style.display = 'block';
  document.getElementById('formArea').style.display = 'none';
});

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height *= maxDim/width; width = maxDim; }
        else if (height > maxDim){ width *= maxDim/height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

window.runAnalyze = async function(){
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>인식하는 중...';
  try {
    const prompt = `이 이미지는 초등학생이 푼 시험지 또는 문제집의 오답 사진입니다.
다음 정보를 JSON 형식으로만 응답하세요. 다른 설명이나 코드블록 없이 순수 JSON 객체만 반환하세요.
{"subject":"국어/수학/영어/사회/과학 중 추정되는 과목(모르면 빈 문자열)","questionText":"문제 내용을 간략히 정리","studentAnswer":"학생이 작성한 답(보이면 적고 안 보이면 빈 문자열)","correctAnswer":"정답(보이거나 유추 가능하면 적고 아니면 빈 문자열)"}`;
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: currentImage.mimeType, data: currentImage.base64 } }] }] })
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error.message);
    let text = json.candidates[0].content.parts[0].text || '';
    text = text.replace(/```json/g,'').replace(/```/g,'').trim();
    const parsed = JSON.parse(text);
    document.getElementById('f_subject').value = ['국어','수학','영어','사회','과학'].includes(parsed.subject) ? parsed.subject : '기타';
    document.getElementById('f_question').value = parsed.questionText || '';
    document.getElementById('f_studentAnswer').value = parsed.studentAnswer || '';
    document.getElementById('f_correctAnswer').value = parsed.correctAnswer || '';
    document.getElementById('formArea').style.display = 'block';
    showToast('인식 완료! 내용을 확인하고 수정해주세요');
  } catch(e){
    console.error(e);
    document.getElementById('formArea').style.display = 'block';
    showToast('자동 인식에 실패했어요. 직접 입력해주세요');
  } finally {
    btn.disabled = false;
    btn.textContent = 'AI로 자동 인식하기';
  }
};

window.saveEntry = async function(){
  const reasonVal = document.getElementById('f_reason').value;
  if (reasonVal === '__new__'){ showToast('새 이유를 추가 버튼으로 먼저 등록해주세요'); return; }
  const entry = {
    date: document.getElementById('f_date').value,
    subject: document.getElementById('f_subject').value,
    questionText: document.getElementById('f_question').value,
    studentAnswer: document.getElementById('f_studentAnswer').value,
    correctAnswer: document.getElementById('f_correctAnswer').value,
    reason: reasonVal,
    retried: false,
    retriedCorrect: null,
    createdAt: serverTimestamp()
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    await addDoc(collection(db, "entries"), entry);
    showToast('오답노트에 저장했어요 ✓');
    resetAddForm();
    await loadEntries();
    renderHome(); renderList(); renderStats();
    switchTab('list');
  } catch(e){ console.error(e); showToast('저장에 실패했어요'); }
  finally { btn.disabled = false; btn.textContent = '오답노트에 저장'; }
};

function resetAddForm(){
  currentImage = { base64: null, mimeType: null };
  document.getElementById('fileInput').value = '';
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('uploadHintWrap').style.display = 'block';
  document.getElementById('analyzeBtn').style.display = 'none';
  document.getElementById('formArea').style.display = 'none';
  document.getElementById('f_question').value = '';
  document.getElementById('f_studentAnswer').value = '';
  document.getElementById('f_correctAnswer').value = '';
  document.getElementById('f_date').valueAsDate = new Date();
}

function renderHome(){
  document.getElementById('homeTotal').textContent = entries.length;
  const weekAgo = Date.now() - 7*24*60*60*1000;
  const weekCount = entries.filter(e => e.createdAt && e.createdAt.toDate && e.createdAt.toDate().getTime() > weekAgo).length;
  document.getElementById('homeWeek').textContent = weekCount;

  const recentWrap = document.getElementById('recentList');
  const recent = entries.slice(0, 5);
  if (recent.length === 0){
    recentWrap.innerHTML = `<div class="empty"><div class="emoji">📝</div>아직 등록된 오답이 없어요</div>`;
    return;
  }
  recentWrap.innerHTML = recent.map(e => {
    const c = SUBJECT_COLORS[e.subject] || SUBJECT_COLORS['기타'];
    return `<div class="recent-item">
      <span class="tag" style="background:${c[0]};color:${c[1]}">${e.subject||'기타'}</span>
      <div class="txt"><div class="q">${escapeHtml(e.questionText||'(내용 없음)')}</div><div class="d">${e.date||''}</div></div>
    </div>`;
  }).join('');
}

function fillFilterOptions(){
  const subjSel = document.getElementById('filterSubject');
  const subjects = [...new Set(entries.map(e => e.subject).filter(Boolean))];
  subjSel.innerHTML = `<option value="">전체 과목</option>` + subjects.map(s => `<option value="${s}">${s}</option>`).join('');
}
['filterSubject','filterReason','filterRange'].forEach(id => document.getElementById(id).addEventListener('change', renderList));

function renderList(){
  fillFilterOptions();
  const subj = document.getElementById('filterSubject').value;
  const reason = document.getElementById('filterReason').value;
  const range = document.getElementById('filterRange').value;
  let filtered = entries.filter(e => {
    if (subj && e.subject !== subj) return false;
    if (reason && e.reason !== reason) return false;
    if (range !== 'all'){
      const days = parseInt(range);
      const cutoff = Date.now() - days*24*60*60*1000;
      const t = e.createdAt && e.createdAt.toDate ? e.createdAt.toDate().getTime() : 0;
      if (t < cutoff) return false;
    }
    return true;
  });

  const wrap = document.getElementById('listArea');
  if (filtered.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="emoji">🔍</div>조건에 맞는 오답이 없어요</div>`;
    return;
  }
  wrap.innerHTML = filtered.map(e => {
    const c = SUBJECT_COLORS[e.subject] || SUBJECT_COLORS['기타'];
    const retriedChecked = e.retried ? 'checked' : '';
    return `
    <div class="entry-card">
      <div class="entry-top">
        <div class="entry-meta">
          <span class="tag" style="background:${c[0]};color:${c[1]}">${e.subject||'기타'}</span>
          <span class="tag" style="background:#F0F0F5;color:#8B90A0">${e.date||''}</span>
          <span class="tag" style="background:#F0F0F5;color:#8B90A0">${e.reason||''}</span>
        </div>
      </div>
      <div class="entry-q">${escapeHtml(e.questionText||'(내용 없음)')}</div>
      <div class="entry-ans"><b>학생 답:</b> ${escapeHtml(e.studentAnswer||'-')} &nbsp;·&nbsp; <b>정답:</b> ${escapeHtml(e.correctAnswer||'-')}</div>
      <div class="entry-actions">
        <button class="icon-btn" onclick="deleteEntry('${e.id}')">🗑 삭제</button>
      </div>
      <div class="retry-toggle">
        <label><input type="checkbox" ${retriedChecked} onchange="toggleRetried('${e.id}', this.checked)"> 다시 풀어봤어요</label>
        <div class="retry-result">
          <button class="ok ${e.retriedCorrect===true?'active':''}" onclick="setRetryResult('${e.id}', true)">맞음</button>
          <button class="no ${e.retriedCorrect===false?'active':''}" onclick="setRetryResult('${e.id}', false)">틀림</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.deleteEntry = async function(id){
  if (!confirm('이 오답을 삭제할까요?')) return;
  await deleteDoc(doc(db, "entries", id));
  entries = entries.filter(e => e.id !== id);
  renderHome(); renderList(); renderStats();
  showToast('삭제했어요');
};

window.toggleRetried = async function(id, checked){
  await updateDoc(doc(db, "entries", id), { retried: checked, retriedCorrect: checked ? entries.find(e=>e.id===id).retriedCorrect : null });
  const e = entries.find(x => x.id === id); e.retried = checked; if (!checked) e.retriedCorrect = null;
  renderList();
};

window.setRetryResult = async function(id, correct){
  await updateDoc(doc(db, "entries", id), { retried: true, retriedCorrect: correct });
  const e = entries.find(x => x.id === id); e.retried = true; e.retriedCorrect = correct;
  renderList(); renderStats();
};

let chartSubject, chartReason, chartTrend;
function renderStats(){
  document.getElementById('statTotal').textContent = entries.length;
  const retriedEntries = entries.filter(e => e.retried);
  const correctCount = retriedEntries.filter(e => e.retriedCorrect === true).length;
  document.getElementById('statRetryRate').textContent = retriedEntries.length ? Math.round(correctCount/retriedEntries.length*100)+'%' : '-';

  const bySubject = {};
  entries.forEach(e => { const s = e.subject||'기타'; bySubject[s] = (bySubject[s]||0)+1; });
  const byReason = {};
  entries.forEach(e => { const r = e.reason||'기타'; byReason[r] = (byReason[r]||0)+1; });

  const weekly = {};
  entries.forEach(e => {
    if (!e.date) return;
    const d = new Date(e.date);
    const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay()+6)%7));
    const key = `${monday.getMonth()+1}/${monday.getDate()}`;
    weekly[key] = (weekly[key]||0)+1;
  });
  const weekKeys = Object.keys(weekly).slice(-8);

  const palette = ['#6C5CE7','#4C7CF0','#E85D8C','#F0924C','#1FAE7A','#8B90A0'];

  if (chartSubject) chartSubject.destroy();
  chartSubject = new Chart(document.getElementById('chartSubject'), {
    type: 'bar',
    data: { labels: Object.keys(bySubject), datasets: [{ data: Object.values(bySubject), backgroundColor: palette, borderRadius: 8 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });

  if (chartReason) chartReason.destroy();
  chartReason = new Chart(document.getElementById('chartReason'), {
    type: 'doughnut',
    data: { labels: Object.keys(byReason), datasets: [{ data: Object.values(byReason), backgroundColor: palette }] },
    options: { plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}} }
  });

  if (chartTrend) chartTrend.destroy();
  chartTrend = new Chart(document.getElementById('chartTrend'), {
    type: 'line',
    data: { labels: weekKeys, datasets: [{ data: weekKeys.map(k=>weekly[k]), borderColor:'#6C5CE7', backgroundColor:'rgba(108,92,231,0.12)', fill:true, tension:.35 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });
}

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

init();
</script>
</body>
</html>
